    <script>
        const sliderState = {};

        function goSlide(sliderId, dotsId, index) {
            const slider = document.getElementById(sliderId);
            const track = slider.querySelector('.flex');
            const slides = track.children;
            const total = slides.length;
            if (index < 0) index = total - 1;
            if (index >= total) index = 0;
            track.style.transform = `translateX(-${index * 100}%)`;
            sliderState[sliderId] = index;
            if (dotsId) {
                document.getElementById(dotsId).querySelectorAll('.dot')
                    .forEach((d, i) => d.classList.toggle('active', i === index));
            }
        }

        [
            { id: 'slider-3', dotsId: 'dots-3', speed: 3000 },
            { id: 'slider-6', dotsId: 'dots-6', speed: 5000 },
            { id: 'slider-7', dotsId: 'dots-7', speed: 5000 },
            { id: 'slider-8', dotsId: 'dots-8', speed: 3000 },
        ].forEach(({ id, dotsId, speed }) => {
            sliderState[id] = 0;
            setInterval(() => goSlide(id, dotsId, (sliderState[id] || 0) + 1), speed);
        });

        document.querySelectorAll('[id^="slider-"]').forEach(slider => {
            let startX = 0;
            slider.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
            slider.addEventListener('touchend', e => {
                const dx = e.changedTouches[0].clientX - startX;
                if (Math.abs(dx) < 40) return;
                const id = slider.id;
                const dotsEl = document.getElementById(id.replace('slider-', 'dots-'));
                goSlide(id, dotsEl?.id ?? null, (sliderState[id] || 0) + (dx < 0 ? 1 : -1));
            }, { passive: true });
        });

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.block-anim').forEach((el, i) => {
            el.style.transitionDelay = `${i * 60}ms`;
            observer.observe(el);
        });
    </script>
